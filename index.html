        function exportResults() {
            const wb = XLSX.utils.book_new();

            // ── Helper styles ─────────────────────────────────────────────
            const headerFill  = { fgColor: { rgb: '1E3A5F' } };
            const winFill     = { fgColor: { rgb: 'D1FAE5' } };
            const loseFill    = { fgColor: { rgb: 'FEE2E2' } };
            const goldFill    = { fgColor: { rgb: 'FEF3C7' } };
            const blueFill    = { fgColor: { rgb: 'DBEAFE' } };
            const redFill     = { fgColor: { rgb: 'FFE4E6' } };

            function hdrCell(v) {
                return { v, t: 's', s: { font: { bold: true, color: { rgb: 'FFFFFF' }, name: 'Arial', sz: 11 }, fill: headerFill, alignment: { horizontal: 'center' } } };
            }
            function cell(v, bold, fill, align) {
                const s = { font: { name: 'Arial', sz: 11, bold: !!bold }, alignment: { horizontal: align || 'left' } };
                if (fill) s.fill = fill;
                return { v: v === undefined || v === null ? '' : v, t: typeof v === 'number' ? 'n' : 's', s };
            }
            function numCell(v, bold, fill) {
                return { v: v === undefined || v === null ? 0 : v, t: 'n', s: { font: { name: 'Arial', sz: 11, bold: !!bold }, alignment: { horizontal: 'center' }, fill: fill || undefined } };
            }

            // ── Standings tab ─────────────────────────────────────────────
            const standings = calculateStandings();
            const sData = [
                [ hdrCell('Rank'), hdrCell('Team'), hdrCell('Players'), hdrCell('Wins'), hdrCell('Losses'), hdrCell('Total Wager Pts'), hdrCell('Playoff Status') ]
            ];
            standings.forEach((team, idx) => {
                let status = 'Eliminated';
                let rowFill = redFill;
                if (idx < 6)       { status = '🏆 BYE';     rowFill = goldFill; }
                else if (idx < 10) { status = '🎯 Playoff'; rowFill = blueFill; }
                sData.push([
                    numCell(idx + 1, idx < 6, rowFill),
                    cell(`Team ${team.team}`, idx < 6, rowFill),
                    cell(team.name, false, rowFill),
                    numCell(team.wins, false, rowFill),
                    numCell(team.losses, false, rowFill),
                    numCell(team.wagerPoints, false, rowFill),
                    cell(status, false, rowFill, 'center')
                ]);
            });
            const sSheet = XLSX.utils.aoa_to_sheet(sData);
            sSheet['!cols'] = [{ wch: 6 }, { wch: 10 }, { wch: 28 }, { wch: 8 }, { wch: 8 }, { wch: 16 }, { wch: 16 }];
            XLSX.utils.book_append_sheet(wb, sSheet, 'Standings');

            // ── One tab per team ──────────────────────────────────────────
            for (let teamNum = 1; teamNum <= 20; teamNum++) {
                const teamName = getTeamName(teamNum);
                const teamWagers = data.wagers[teamNum] || {};
                const schedule = getTeamSchedule(teamNum);

                const rows = [
                    [ hdrCell('Time'), hdrCell('Event'), hdrCell('Opponent'), hdrCell('Wager'), hdrCell('Result') ]
                ];

                schedule.forEach(item => {
                    if (item.event === 'Break' || item.event === 'Pizza!') return;
                    const opponentName = item.opponent ? getTeamName(item.opponent) : '—';
                    const wager = teamWagers[item.event] !== undefined ? teamWagers[item.event] : '—';
                    const resultKey = getResultKey(item.time, item.team1, item.team2, item.event);
                    const stored = data.results[resultKey];
                    let resultText = '—';
                    let resultFill = null;
                    if (stored !== undefined) {
                        if (stored === teamNum) { resultText = 'Win';  resultFill = winFill; }
                        else                    { resultText = 'Lose'; resultFill = loseFill; }
                    }
                    rows.push([
                        cell(item.time, false, null, 'center'),
                        cell(item.event),
                        cell(opponentName),
                        typeof wager === 'number' ? numCell(wager, false, null) : cell(wager, false, null, 'center'),
                        cell(resultText, true, resultFill, 'center')
                    ]);
                });

                // Summary row at the bottom
                const teamStanding = standings.find(s => s.team === teamNum);
                const wins   = teamStanding ? teamStanding.wins : 0;
                const losses = teamStanding ? teamStanding.losses : 0;
                const wagerPts = teamStanding ? teamStanding.wagerPoints : 0;
                const rank   = teamStanding ? standings.indexOf(teamStanding) + 1 : '—';
                rows.push([]); // blank spacer
                rows.push([
                    cell(''),
                    cell('TOTALS', true, null),
                    cell(''),
                    numCell(Object.values(teamWagers).reduce((s, v) => s + (parseInt(v) || 0), 0), true),
                    cell(`${wins}W - ${losses}L`, true, null, 'center')
                ]);
                rows.push([
                    cell(''),
                    cell('Rank', true),
                    cell(''),
                    cell('Wager Pts', true),
                    cell('')
                ]);
                rows.push([
                    cell(''),
                    cell('#' + rank, true, null, 'center'),
                    cell(''),
                    numCell(wagerPts, true),
                    cell('')
                ]);

                const tSheet = XLSX.utils.aoa_to_sheet(rows);
                tSheet['!cols'] = [{ wch: 10 }, { wch: 24 }, { wch: 28 }, { wch: 8 }, { wch: 8 }];

                // Sheet name: "T1 - Smith & Jones" truncated to 31 chars (Excel limit)
                const rawName = `T${teamNum} - ${teamName}`;
                const sheetName = rawName.length > 31 ? rawName.slice(0, 31) : rawName;
                XLSX.utils.book_append_sheet(wb, tSheet, sheetName);
            }

            // ── Download ──────────────────────────────────────────────────
            const date = new Date().toISOString().slice(0, 10);
            XLSX.writeFile(wb, `Silvalympics_Results_${date}.xlsx`);
        }

        async function clearAllData() {
            const code = prompt('Enter 4-digit code to clear all data:');
            if (code === '0820') {
                if (confirm('Are you SURE you want to clear ALL data? This cannot be undone!')) {
                    data.teamNames = {};
                    data.wagers = {};
                    data.results = {};
                    data.scheduleOverride = {};
                    data.wagerOverride = {};
                    data.schedulesEnabled = true;
                    data.wagersEnabled = true;
                    data.resultsEnabled = true;
                    data.wheelEliminated = [];
                    data.wheelLastResult = null;
                    data.playoffsEnabled = false;
                    data.playoffSeeds = [];
                    lastSaveTime = Date.now();
                    await saveData(['teamNames', 'wagers', 'results', 'settings']);
                    alert('All data cleared!');
                    state.view = 'team-select';
                    render();
                }
            } else if (code !== null) {
                alert('Incorrect code!');
            }
        }
        
        function setAllSchedules(enabled) {
            const code = prompt(`Enter 4-digit code to ${enabled ? 'enable' : 'disable'} schedules for ALL teams:`);
            if (code === '0820') {
                data.schedulesEnabled = enabled;
                // Clear individual overrides so this truly applies to every team,
                // not just the ones without a personal override set.
                data.scheduleOverride = {};
                alert(`Schedules ${enabled ? 'enabled' : 'disabled'} for all teams!`);
                lastSaveTime = Date.now();
                render();
                saveData();
            } else if (code !== null) {
                alert('Incorrect code!');
            }
        }
        
        function toggleIndividualSchedule(teamNum) {
            const code = prompt(`Enter 4-digit code to toggle schedule for Team ${teamNum}:`);
            if (code === '0820') {
                if (!data.scheduleOverride) data.scheduleOverride = {};

                // Flip the team's current EFFECTIVE status (global + any existing override)
                // and store that as an explicit override, so it holds regardless of the
                // global Toggle All Schedules switch.
                const currentlyEnabled = isScheduleEnabledForTeam(teamNum);
                data.scheduleOverride[teamNum] = !currentlyEnabled;
                alert(`Schedule ${!currentlyEnabled ? 'enabled' : 'disabled'} for Team ${teamNum}!`);

                lastSaveTime = Date.now();
                render();
                saveData();
            } else if (code !== null) {
                alert('Incorrect code!');
            }
        }
        
        function setAllWagers(enabled) {
            const code = prompt(`Enter 4-digit code to ${enabled ? 'enable' : 'disable'} wagers for ALL teams:`);
            if (code === '0820') {
                data.wagersEnabled = enabled;
                // Clear individual overrides so this truly applies to every team,
                // not just the ones without a personal override set.
                data.wagerOverride = {};
                alert(`Wager editing ${enabled ? 'enabled' : 'disabled'} for all teams!`);
                lastSaveTime = Date.now();
                render();
                saveData();
            } else if (code !== null) {
                alert('Incorrect code!');
            }
        }

        function setResultsEnabled(enabled) {
            const code = prompt(`Enter 4-digit code to ${enabled ? 'enable' : 'disable'} results entry for ALL teams:`);
            if (code === '0820') {
                data.resultsEnabled = enabled;
                alert(`Results entry ${enabled ? 'enabled' : 'disabled'} for all teams!`);
                lastSaveTime = Date.now();
                render();
                saveData();
            } else if (code !== null) {
                alert('Incorrect code!');
            }
        }

        async function setPlayoffsEnabled(enabled) {
            const code = prompt(`Enter 4-digit code to turn playoffs ${enabled ? 'ON' : 'OFF'}:`);
            if (code !== '0820') {
                if (code !== null) alert('Incorrect code!');
                return;
            }

            if (enabled) {
                if (!confirm('This will lock in the CURRENT standings as the playoff seeds and start a fresh bracket. Any previous playoff results will be cleared. Continue?')) {
                    return;
                }
                const standings = calculateStandings();
                data.playoffSeeds = standings.map(s => s.team);

                // Fresh start - remove any leftover playoff results from a previous run
                Object.keys(data.results).forEach(key => {
                    if (key.startsWith('playoff_')) delete data.results[key];
                });

                data.playoffsEnabled = true;
                alert('Playoffs are now ON! Seeds have been locked in based on current standings.');
                lastSaveTime = Date.now();
                render();
                await saveData(['results', 'settings']);
            } else {
                data.playoffsEnabled = false;
                alert('Playoffs are now OFF.');
                lastSaveTime = Date.now();
                render();
                saveData();
            }
        }

        function toggleWheelEvent(event) {
            if (wheelSpinning) return;
            if (!data.wheelEliminated) data.wheelEliminated = [];
            if (data.wheelEliminated.includes(event)) {
                data.wheelEliminated = data.wheelEliminated.filter(e => e !== event);
            } else {
                data.wheelEliminated.push(event);
            }
            lastSaveTime = Date.now();
            render();
            saveData();
        }

        function resetWheel() {
            if (wheelSpinning) return;
            data.wheelEliminated = [];
            data.wheelLastResult = null;
            lastSaveTime = Date.now();
            render();
            saveData();
        }

        function spinWheel() {
            if (wheelSpinning) return;
            const eliminated = data.wheelEliminated || [];
            const activeEvents = EVENTS.filter(e => !eliminated.includes(e));
            if (activeEvents.length === 0) {
                alert('All events are eliminated - reset the wheel first.');
                return;
            }

            wheelSpinning = true;
            const winningEvent = activeEvents[Math.floor(Math.random() * activeEvents.length)];
            const winningIndex = EVENTS.indexOf(winningEvent);
            const segAngle = 360 / EVENTS.length;
            const segmentCenterAngle = winningIndex * segAngle + segAngle / 2;

            // Small random offset within the segment so it doesn't always land dead-center
            const jitter = (Math.random() - 0.5) * (segAngle * 0.6);

            // Rotation needed (mod 360) so the winning segment's center lands under the
            // fixed pointer at the top of the wheel.
            const neededMod = ((360 - segmentCenterAngle + jitter) % 360 + 360) % 360;

            const spins = 5; // full extra rotations for a satisfying spin animation
            const currentMod = ((wheelCurrentRotation % 360) + 360) % 360;
            let newRotation = (wheelCurrentRotation - currentMod) + neededMod + spins * 360;
            if (newRotation <= wheelCurrentRotation) newRotation += 360; // safety: always spin forward

            // Mutate the existing DOM element directly (not via render()) so the CSS
            // transition actually animates - a full re-render would recreate the node
            // and the browser would just snap to the new position instead of spinning.
            const wheelEl = document.getElementById('wheel-disc');
            if (wheelEl) {
                wheelEl.style.transform = `rotate(${newRotation}deg)`;
            }
            wheelCurrentRotation = newRotation;

            const spinBtn = document.getElementById('spin-btn');
            if (spinBtn) {
                spinBtn.setAttribute('disabled', 'true');
                spinBtn.textContent = '🎡 Spinning...';
            }

            setTimeout(() => {
                wheelSpinning = false;
                data.wheelLastResult = winningEvent;
                lastSaveTime = Date.now();
                render();
                saveData();
            }, 4100); // slightly longer than the 4s CSS transition so it fully settles first
        }

        function openAdminResultsEntry() {
            const code = prompt('Enter 4-digit admin code to enter results directly:');
            if (code === '0820') {
                state.view = 'admin-results-entry';
                render();
            } else if (code !== null) {
                alert('Incorrect code!');
            }
        }

        function adminSaveResult(time, t1, t2, event, winner) {
            // Admin entry always works, regardless of the resultsEnabled lock -
            // that's the whole point of this screen (bypass sync issues by having
            // one person enter results directly).
            const key = getResultKey(time, t1, t2, event);
            const existing = data.results[key];

            if (existing === winner) {
                delete data.results[key];
            } else if (existing !== undefined) {
                const confirmed = confirm(
                    `This match is already recorded as a win for ${getTeamName(existing)}.\n\n` +
                    `Change it so ${getTeamName(winner)} is the winner instead?`
                );
                if (!confirmed) return;
                data.results[key] = winner;
            } else {
                data.results[key] = winner;
            }

            lastSaveTime = Date.now();
            render();
            mergeField('results', key, data.results[key]);
        }
        
        function toggleIndividualWagers(teamNum) {
            const code = prompt(`Enter 4-digit code to toggle wagers for Team ${teamNum}:`);
            if (code === '0820') {
                if (!data.wagerOverride) data.wagerOverride = {};

                // Flip the team's current EFFECTIVE status (global + any existing override)
                // and store that as an explicit override, so it holds regardless of the
                // global Toggle All Wagers switch.
                const currentlyEnabled = isWagerEnabledForTeam(teamNum);
                data.wagerOverride[teamNum] = !currentlyEnabled;
                alert(`Wager editing ${!currentlyEnabled ? 'enabled' : 'disabled'} for Team ${teamNum}!`);

                lastSaveTime = Date.now();
                render();
                saveData();
            } else if (code !== null) {
                alert('Incorrect code!');
            }
        }
        
        function randomizeWagers() {
            const wagerData = {};
            let remaining = 50;
            const events = [...EVENTS];
            
            // Assign random wagers between 1-20 for first 8 events
            for (let i = 0; i < 8; i++) {
                const min = Math.max(1, remaining - (20 * (8 - i)));
                const max = Math.min(20, remaining - (8 - i));
                const wager = Math.floor(Math.random() * (max - min + 1)) + min;
                wagerData[events[i]] = wager;
                remaining -= wager;
            }
            
            // Last event gets whatever is remaining
            wagerData[events[8]] = remaining;
            
            if (!data.wagers[state.selectedTeam]) data.wagers[state.selectedTeam] = {};
            data.wagers[state.selectedTeam] = wagerData;
            render();
        }

        (async () => {
            // Load quota count from localStorage (persists across page refreshes)
            loadQuotaCount();
            dbg('Startup: ' + apiCallCount + ' API calls already made today' + (quotaExceeded ? ' — QUOTA LIMIT REACHED' : ''));

            // Load any pending saves that failed before the page was closed/refreshed
            loadPendingOps();
            if (pendingOps.length > 0) {
                dbg('Startup: found ' + pendingOps.length + ' unsynced change(s) from a previous session, retrying...');
            }

            // Render immediately so user sees the interface right away
            render();
            updateSyncBanner();
            
            // Load data in background on startup
            await loadData();

            // Try to sync any pending changes right away
            retryPendingOps();
            
            // Standings-only auto-refresh every 60 seconds.
            // Disabled automatically if daily quota reaches 19,000 calls.
            setInterval(async () => {
                if (state.view === 'standings') {
                    if (quotaExceeded) {
                        dbg('Auto-refresh skipped — quota limit reached (' + apiCallCount + ' calls today). Use Manual Refresh.');
                    } else {
                        await loadData();
                    }
                }
            }, 60000);

            // Retry any pending (previously failed) saves every 8 seconds until
            // they succeed. This is what actually prevents data loss under load -
            // a failed save keeps trying in the background instead of vanishing.
            setInterval(() => {
                if (pendingOps.length > 0) {
                    retryPendingOps();
                }
            }, 8000);
        })();
    </script>
